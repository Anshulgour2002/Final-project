<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello</h1>

    
    <script>
        let age=7
        let gender='female';
        let Discount;

        if(age <= 5){
            Discount=100;
        }
        
        else if(gender==='female' || age <=8){
            Discount=50;
        }
        
        else if(age >= 65){
            Discount=30;
        }
        else{
            Discount=0;
        }

        console.log(`The discount of metro Ticket is ${Discount}`)

    </script>
</body>
