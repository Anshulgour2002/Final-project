<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calculator.css">
    <title>Calculator</title>
</head>

<body>
 <div class="Input">
    <input type="text" id="display" readonly>
 <div class="button-div">
   
    <button class="btn" onclick="currentDisplayValue=currentDisplayValue+'';document.querySelector('#display').value =currentDisplayValue;">c</button>
    <button class="btn" onclick=" currentDisplayValue=currentDisplayValue+'1';document.querySelector('#display').value =currentDisplayValue;
    ">1</button>
    <button class="btn" onclick=" currentDisplayValue=currentDisplayValue+'2';document.querySelector('#display').value =currentDisplayValue; 
    ">2</button>
    <button class="btn" onclick=" currentDisplayValue=currentDisplayValue+'+';document.querySelector('#display').value =currentDisplayValue;
    ">+</button>
    <button class="btn" onclick=" currentDisplayValue=currentDisplayValue+'3';document.querySelector('#display').value =currentDisplayValue;
    ">3</button>
    <button class="btn" onclick="currentDisplayValue=currentDisplayValue +'4';document.querySelector('#display').value =currentDisplayValue;
    ">4</button>
    <button class="btn" onclick="currentDisplayValue=currentDisplayValue +'-';document.querySelector('#display').value =currentDisplayValue;
    ">-</button>
    <button class="btn" onclick="currentDisplayValue=currentDisplayValue +'5';document.querySelector('#display').value =currentDisplayValue;">5</button>
    <button class="btn" onclick="currentDisplayValue=currentDisplayValue +'6';document.querySelector('#display').value =currentDisplayValue;">6</button>
    <button class="btn" onclick="currentDisplayValue=currentDisplayValue +'*';document.querySelector('#display').value =currentDisplayValue;">*</button>
    <button class="btn" onclick="currentDisplayValue=currentDisplayValue +'7';document.querySelector('#display').value =currentDisplayValue;">7</button>
    <button class="btn" onclick="currentDisplayValue=currentDisplayValue +'8';document.querySelector('#display').value =currentDisplayValue;">8</button>
    <button class="btn" onclick="currentDisplayValue=currentDisplayValue +'/';document.querySelector('#display').value =currentDisplayValue;">/</button>


    <button class="btn" onclick="currentDisplayValue= eval(currentDisplayValue) +' ';document.querySelector('#display').value =currentDisplayValue;">=</button>
    
     
    
    <button class="btn" onclick="currentDisplayValue=currentDisplayValue +'9';document.querySelector('#display').value =currentDisplayValue;">9</button>
    <button class="btn" onclick="currentDisplayValue=currentDisplayValue +'0';document.querySelector('#display').value =currentDisplayValue;">0</button>
    <button class="btn" onclick="currentDisplayValue=currentDisplayValue +'.';document.querySelector('#display').value =currentDisplayValue;">.</button>
 </div>
 </div>
 <script>
    let currentDisplayValue='';
    document.querySelector('#display').value =currentDisplayValue;



 </script>

</body>
</html>
